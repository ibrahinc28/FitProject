server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: ms-ventas
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ventas_db}
    username: ${DATABASE_USERNAME:fit_user}
    password: ${DATABASE_PASSWORD:fit_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
