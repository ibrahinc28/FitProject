services:
  ms-users:
    build: .
    container_name: fit-users-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://fit-postgres:5432/users_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-fit_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-fit_pass}
      SERVER_PORT: 8090
    ports:
      - "8090:8090"
    networks:
      - fit-network

networks:
  fit-network:
    external: true
