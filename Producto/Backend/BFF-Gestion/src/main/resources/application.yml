server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /
  error:
    include-message: always

spring:
  application:
    name: fit-bff
  
  # Configuración de microservicios externos
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
        max-connections: 200
        max-connections-per-route: 50
      compression:
        request:
          enabled: true
        response:
          enabled: true

# Configuración personalizada de servicios
services:
  ms-gestion:
    url: ${MS_GESTION_URL:http://localhost:8080/api/v1}
  ms-users:
    url: ${MS_USERS_URL:http://localhost:8090/api/v1}

# JWT
jwt:
  secret: ${JWT_SECRET:fitproject-secret-key-must-be-at-least-32-chars-long}
  expiration: ${JWT_EXPIRATION:86400000}

# Configuración de logging
logging:
  level:
    com.fitproject.bff: INFO
    com.fitproject.bff.client: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Configuración de Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    docExpansion: none

# Configuración de manejo de errores
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
